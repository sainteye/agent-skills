<!doctype html>
<html><head><meta charset="utf-8"><title>Clawdline intro reel</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
const W=1920,H=1080,FPS=60,DUR=30;
const cv=document.getElementById('c'), out=cv.getContext('2d');
const sub=document.createElement('canvas'); sub.width=W; sub.height=H;
let ctx=sub.getContext('2d');
const C={bg:'#0b0a09',ink:'#f3ede4',dim:'#8a837b',mute:'#4a443f',faint:'#221f1c',panel:'#13110f',panel2:'#1b1815',line:'#2e2a26',
  or:'#d97757',orL:'#f0a283',gr:'#4ccb7f',am:'#e8b04a',cx:'#a9c1ff'};
const MONO='Menlo, "SF Mono", monospace', SANS='"Helvetica Neue", Helvetica, Arial, sans-serif';

/* ---------- math ---------- */
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const P=(t,a,b)=>clamp((t-a)/(b-a));
const E={
 outExpo:x=>x>=1?1:1-Math.pow(2,-10*x),
 inExpo:x=>x<=0?0:Math.pow(2,10*x-10),
 inOutExpo:x=>x<=0?0:x>=1?1:x<.5?Math.pow(2,20*x-10)/2:(2-Math.pow(2,-20*x+10))/2,
 outCubic:x=>1-Math.pow(1-x,3),
 inCubic:x=>x*x*x,
 inOutCubic:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
 outBack:x=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)},
 outQuint:x=>1-Math.pow(1-x,5),
};
const spring=x=>x<=0?0:1-Math.exp(-6.5*x)*Math.cos(12*x);
const hh=(a,b=0,c=0)=>{const x=Math.sin(a*127.1+b*311.7+c*74.7)*43758.5453;return x-Math.floor(x)};
const tri=(t,a,b)=>{const m=(a+b)/2;return t<a||t>b?0:t<m?(t-a)/(m-a):(b-t)/(b-m)};

/* ---------- drawing helpers ---------- */
function font(o){return `${o.w||600} ${o.s||40}px ${o.f||SANS}`}
function tw(s,o){ctx.save();ctx.font=font(o);ctx.letterSpacing=(o.ls||0)+'px';const w=ctx.measureText(s).width;ctx.restore();return w}
function txt(s,x,y,o={}){ctx.save();ctx.font=font(o);ctx.fillStyle=o.c||C.ink;ctx.globalAlpha*=(o.a??1);
 ctx.textAlign=o.al||'left';ctx.textBaseline=o.bl||'alphabetic';ctx.letterSpacing=(o.ls||0)+'px';ctx.fillText(s,x,y);ctx.restore()}
function rr(x,y,w,h,r,fill,stroke,lw=1){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}
function circ(x,y,r,fill,stroke,lw=2){ctx.beginPath();ctx.arc(x,y,Math.max(0,r),0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}
function alpha(a,fn){ctx.save();ctx.globalAlpha*=a;fn();ctx.restore()}
// words slide up out of a mask
function words(s,x,y,t,t0,o={}){
 const ws=s.split(' '),st=o.st??.07,d=o.d??.75,sp=tw(' ',o);let cx=x;
 if(o.al==='center')cx=x-tw(s,o)/2; if(o.al==='right')cx=x-tw(s,o);
 ws.forEach((w,i)=>{const p=E.outExpo(P(t,t0+i*st,t0+i*st+d));const ww=tw(w,o);
  let dy=(1-p)*o.s*1.15;
  if(o.t1!=null){const q=E.inExpo(P(t,o.t1+i*st*.5,o.t1+i*st*.5+.4));dy-=q*o.s*1.15}
  if(p>0){ctx.save();ctx.beginPath();ctx.rect(cx-20,y-o.s*1.02,ww+40,o.s*1.32);ctx.clip();
   txt(w,cx,y+dy,{...o,al:'left',c:(o.colors&&o.colors[i])||o.c});ctx.restore()}
  cx+=ww+sp});
}
// characters rise with stagger
function chars(s,x,y,t,t0,o={}){
 const st=o.st??.035,d=o.d??.6;let cx=x-(o.al==='center'?tw(s,o)/2:0);
 for(let i=0;i<s.length;i++){const ch=s[i],cw=tw(ch,o)+(o.ls||0);const p=P(t,t0+i*st,t0+i*st+d);
  if(p>0){const e=E.outExpo(p);ctx.save();ctx.beginPath();ctx.rect(cx-10,y-o.s*1.05,cw+20,o.s*1.35);ctx.clip();
   ctx.translate(cx,y+(1-e)*o.s*1.1);ctx.rotate((1-e)*.25);txt(ch,0,0,{...o,al:'left',ls:0});ctx.restore()}
  cx+=cw}
}
// brand mascot (8x4 grid)
const MASK=["01111110","01011010","11111111","01111110"];
const CELLS=[];MASK.forEach((row,r)=>[...row].forEach((v,c)=>{if(v==='1')CELLS.push({r,c})}));
function mascotPath(x0,y0,cell){ctx.beginPath();CELLS.forEach(({r,c})=>ctx.rect(x0+c*cell,y0+r*cell,cell,cell))}
function mascot(cx,cy,cell,o={}){
 const x0=cx-4*cell,y0=cy-2*cell;
 ctx.save();ctx.fillStyle=o.color||C.or;CELLS.forEach(({r,c})=>ctx.fillRect(x0+c*cell-.3,y0+r*cell-.3,cell+.6,cell+.6));
 const b=o.blink||0; if(b>0){[2,5].forEach(c=>ctx.fillRect(x0+c*cell,y0+cell,cell,cell*b+.5))}
 if(o.grid&&cell>14){ctx.save();mascotPath(x0,y0,cell);ctx.clip();ctx.strokeStyle='rgba(0,0,0,'+(.22*(o.grid))+')';ctx.lineWidth=Math.max(1,cell*.025);ctx.beginPath();
  for(let i=1;i<16;i++){ctx.moveTo(x0+i*cell/2,y0);ctx.lineTo(x0+i*cell/2,y0+4*cell)}for(let j=1;j<8;j++){ctx.moveTo(x0,y0+j*cell/2);ctx.lineTo(x0+8*cell,y0+j*cell/2)}ctx.stroke();ctx.restore()}
 ctx.restore();
}
function greenLine(cx,y,w,h,t,glow=1){
 ctx.save();ctx.shadowColor=C.gr;ctx.shadowBlur=24*glow;ctx.fillStyle=C.gr;ctx.fillRect(cx-w/2,y-h/2,w,h);ctx.shadowBlur=0;
 // light flowing left -> right
 const ph=(t*.85)%1.3-.15, gx=cx-w/2+ph*w;const g=ctx.createLinearGradient(gx-w*.18,0,gx+w*.18,0);
 g.addColorStop(0,'rgba(220,255,232,0)');g.addColorStop(.5,'rgba(220,255,232,.85)');g.addColorStop(1,'rgba(220,255,232,0)');
 ctx.fillStyle=g;ctx.fillRect(cx-w/2,y-h/2,w,h);ctx.restore();
}
function lock(x,y,s,col){ctx.save();ctx.translate(x,y);ctx.strokeStyle=col;ctx.lineWidth=s*.16;ctx.beginPath();ctx.arc(0,-s*.12,s*.26,Math.PI,0);ctx.stroke();
 ctx.fillStyle=col;ctx.fillRect(-s*.4,-s*.12,s*.8,s*.58);ctx.restore()}
function check(x,y,s,col,p=1,lw){ctx.save();ctx.strokeStyle=col;ctx.lineWidth=lw||s*.22;ctx.lineCap='round';ctx.lineJoin='round';
 const pts=[[-.45,0],[-.12,.32],[.48,-.34]];ctx.beginPath();ctx.moveTo(x+pts[0][0]*s,y+pts[0][1]*s);
 const L1=.47,L2=.89,tot=L1+L2,d=p*tot;
 if(d<=L1){const k=d/L1;ctx.lineTo(x+lerp(pts[0][0],pts[1][0],k)*s,y+lerp(pts[0][1],pts[1][1],k)*s)}
 else{ctx.lineTo(x+pts[1][0]*s,y+pts[1][1]*s);const k=(d-L1)/L2;ctx.lineTo(x+lerp(pts[1][0],pts[2][0],k)*s,y+lerp(pts[1][1],pts[2][1],k)*s)}
 ctx.stroke();ctx.restore()}
function statusDot(x,y,st,t,ph=0,sc=1){
 if(st==='working'){const q=((t*1.1+ph)%1);circ(x,y,7*sc+q*16,null,'rgba(76,203,127,'+(1-q)*.7+')',2);circ(x,y,7*sc,C.gr)}
 else if(st==='waiting'){const b=.55+.45*Math.sin(t*9+ph*6);circ(x,y,13*sc,'rgba(232,176,74,'+.18*b+')');circ(x,y,7*sc,C.am)}
 else{circ(x,y,10*sc,C.gr);check(x,y+.5,11*sc,C.bg,1,2.6)}
}
function cursorArrow(x,y,a=1){alpha(a,()=>{ctx.save();ctx.translate(x,y);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,30);ctx.lineTo(8,23);ctx.lineTo(14,36);ctx.lineTo(19,34);ctx.lineTo(13,21);ctx.lineTo(23,21);ctx.closePath();
 ctx.fillStyle=C.ink;ctx.fill();ctx.strokeStyle=C.bg;ctx.lineWidth=2;ctx.stroke();ctx.restore()})}

/* ---------- timeline helpers ---------- */
// horizontal whip-pans shared by scenes 4, 5 and 6
const PANW=2320;
function panX(t){return PANW*(E.inOutExpo(P(t,13.7,14.1))+E.inOutExpo(P(t,17.7,18.1)))}

/* ================= S1: everywhere ================= */
function pane(x,y,w,h,idx,t,appear,frameA,s,hero){
 ctx.save();ctx.translate(x+w/2,y+h/2);ctx.scale(s,s);ctx.translate(-w/2,-h/2);
 const lt=t-appear;
 if(frameA>0){alpha(frameA,()=>{rr(0,0,w,h,9,C.panel,C.line,1.2);
  ctx.fillStyle=C.panel2;ctx.beginPath();ctx.roundRect(0,0,w,24,[9,9,0,0]);ctx.fill();
  ['#e0605a','#e0b34a','#5bbf6a'].forEach((col,i)=>circ(14+i*13,12,3.6,col));
  const prov=hh(idx,9)<.5?'claude code':'codex';const names=['api','web','infra','docs','ios','search','billing','auth','cli','ml','etl','ops'];
  txt(names[idx%12]+' · '+prov,w-10,16,{f:MONO,s:9.5,w:400,c:C.dim,al:'right'})})}
 ctx.save();ctx.beginPath();ctx.rect(4,26,w-8,h-30);ctx.clip();
 if(hero){
  const typed='claude'.slice(0,Math.floor(P(t,.3,.85)*6+.0001));
  txt('›',12,46,{f:MONO,s:12,w:700,c:C.or});txt(typed,26,46,{f:MONO,s:12,w:500,c:C.ink});
  const cxp=26+tw(typed,{f:MONO,s:12,w:500});if(t<1.05&&(t*2.4%1)<.6)ctx.fillStyle=C.ink,ctx.fillRect(cxp+1,36,7,13);
  const n=Math.floor(Math.max(0,t-1.05)/.07);
  for(let j=0;j<Math.min(n,13);j++)bars(idx,j,62+j*12.5,w);
 } else if(lt>0){
  const sp=16+hh(idx,3)*34,off=lt*sp,base=Math.floor(off/12.5),fr=off%12.5;
  for(let j=0;j<16;j++)bars(idx,base+j,36+j*12.5-fr,w);
 }
 ctx.restore();
 // status chip
 if(frameA>0&&!(hero&&t<1.6)){const waitThresh=.3+Math.max(0,t-3.3)*1.4;const waiting=hh(idx,5)<waitThresh;
  alpha(frameA,()=>{rr(8,h-26,waiting?96:84,18,9,waiting?'rgba(232,176,74,.16)':'rgba(76,203,127,.13)');
   statusDot(19,h-17,waiting?'waiting':'working',t,idx*.37,.5);
   txt(waiting?'waiting':'working',29,h-13,{f:MONO,s:9.5,w:500,c:waiting?C.am:C.gr})})}
 ctx.restore();
}
function bars(idx,k,y,w){let x=12+Math.floor(hh(idx,k,1)*3)*14;const n=1+Math.floor(hh(idx,k,2)*4);
 for(let i=0;i<n&&x<w-20;i++){const ww=10+hh(idx,k,i+3)*62;const r=hh(idx,k,i+9);
  ctx.fillStyle=r<.7?'#3a3531':r<.85?'rgba(217,119,87,.75)':'rgba(76,203,127,.7)';ctx.fillRect(x,y,Math.min(ww,w-14-x),5);x+=ww+6}}
function S1(t){
 if(t>=4)return;
 const cols=6,rows=4,pw=290,ph=220,g=18,gw=cols*pw+(cols-1)*g,gh=rows*ph+(rows-1)*g,gx=(W-gw)/2,gy=(H-gh)/2;
 const hc={x:gx+2*(pw+g)+48,y:gy+(ph+g)+42};
 const zp=E.inOutExpo(P(t,1.15,2.65)),z=lerp(3.3,1,zp)*lerp(1,1.06,P(t,2.65,4)),fx=lerp(hc.x,W/2,zp),fy=lerp(hc.y,H/2,zp);
 const amp=Math.max(0,t-3.25)*7;const sx=(hh(Math.floor(t*60),1)-.5)*amp,sy=(hh(Math.floor(t*60),2)-.5)*amp;
 ctx.save();ctx.translate(W/2+sx,H/2+sy);ctx.scale(z,z);ctx.translate(-fx,-fy);
 for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
  const idx=r*cols+c,hero=(c===2&&r===1),d=Math.hypot(c-2,r-1);
  const ap=hero?.95:1.3+d*.12+hh(idx,7)*.06;const p=P(t,ap,ap+.5);
  if(!hero&&p<=0)continue;
  const s=hero?1:lerp(.6,1,E.outBack(p)),a=hero?E.outCubic(P(t,.95,1.25)):E.outCubic(p);
  pane(gx+c*(pw+g),gy+r*(ph+g),pw,ph,idx,t,ap,a,s,hero);
 }
 ctx.restore();
 // headline
 const hp=P(t,2.45,2.9);
 if(hp>0){const gr=ctx.createLinearGradient(0,350,0,730);gr.addColorStop(0,'rgba(11,10,9,0)');gr.addColorStop(.5,'rgba(11,10,9,.92)');gr.addColorStop(1,'rgba(11,10,9,0)');
  alpha(E.outCubic(hp),()=>{ctx.fillStyle=gr;ctx.fillRect(0,350,W,380)});
  words('Your agents are everywhere.',W/2,575,t,2.5,{s:124,w:800,al:'center',ls:-3,st:.06});
  const n=Math.round(lerp(0,24,E.outCubic(P(t,3.0,3.5)))),wn=Math.round(lerp(0,Math.min(19,7+Math.max(0,t-3.3)*20),P(t,3.0,3.5)));
  alpha(P(t,3.0,3.15),()=>txt(`${String(n).padStart(2,'0')} sessions   ·   3 machines   ·   ${String(wn).padStart(2,'0')} waiting on you`,W/2,660,{f:MONO,s:24,w:500,c:C.am,al:'center',ls:1}));
 }
}

/* ================= S2: rapid cuts ================= */
const CUTS=[
 {s:'Claude Code.',bg:C.ink,fg:C.bg,sz:220},
 {s:'Codex.',bg:C.bg,fg:C.ink,sz:330},
 {s:'Your laptop.',bg:C.or,fg:C.bg,sz:230},
 {s:'$ ssh linux-box',bg:C.bg,fg:C.gr,sz:150,f:MONO,w:700},
 {s:'Your phone.',bg:C.ink,fg:C.or,sz:230},
 {s:'Twelve tabs.',bg:C.bg,fg:C.ink,sz:220,echo:1},
 {s:"Who’s waiting?",bg:C.am,fg:C.bg,sz:200},
];
function S2(t){
 if(t<4||t>=6.02)return;const lt=t-4;
 if(lt>=1.75){ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  const p=E.outBack(P(lt,1.78,1.93)),s=14*p;ctx.save();ctx.shadowColor=C.gr;ctx.shadowBlur=30;ctx.fillStyle=C.gr;ctx.fillRect(W/2-s/2,H/2-s/2,s,s);ctx.restore();return}
 const i=Math.floor(lt/.25),u=(lt-i*.25)/.25,k=CUTS[i];
 ctx.fillStyle=k.bg;ctx.fillRect(0,0,W,H);
 // sweeping slab
 ctx.save();ctx.translate(W/2,H/2);ctx.rotate(-.22+(i%2)*.44);ctx.fillStyle=k.fg;ctx.globalAlpha=.07;ctx.fillRect(lerp(-1500,700,E.outCubic(u)),-900,520,1800);ctx.restore();
 const e=E.outExpo(u),sc=lerp(1.25,1,e),rot=(i%2?1:-1)*.035*(1-e);
 const o={s:k.sz,w:k.w||800,f:k.f||SANS,ls:lerp(36,-5,e),c:k.fg,al:'center',bl:'middle'};
 ctx.save();ctx.translate(W/2,H/2);ctx.scale(sc,sc);ctx.rotate(rot);
 if(k.echo){for(let j=5;j>0;j--){ctx.save();ctx.font=font(o);ctx.letterSpacing=o.ls+'px';ctx.textAlign='center';ctx.textBaseline='middle';ctx.strokeStyle=C.ink;
  ctx.globalAlpha=.16*(1-j/6);ctx.lineWidth=2;ctx.strokeText(k.s,0,-j*58*e+j*8);ctx.strokeText(k.s,0,j*58*e-j*8);ctx.restore()}}
 if(k.bg===C.bg){const dx=(1-e)*22+3;ctx.save();ctx.globalCompositeOperation='lighter';
  txt(k.s,-dx,0,{...o,c:'rgba(255,40,70,.55)'});txt(k.s,dx,0,{...o,c:'rgba(40,200,255,.55)'});ctx.restore()}
 txt(k.s,0,0,o);ctx.restore();
 // HUD
 txt(`${String(i+1).padStart(2,'0')} / 07`,70,90,{f:MONO,s:22,w:600,c:k.fg,a:.6});
 txt('NO SINGLE VIEW',W-70,90,{f:MONO,s:22,w:600,c:k.fg,a:.6,al:'right',ls:3});
 txt(`signal ${'▮'.repeat(i+1)}${'▯'.repeat(6-i)}`,70,H-70,{f:MONO,s:22,w:500,c:k.fg,a:.6});
 if(u<.1){ctx.fillStyle='rgba(255,255,255,'+(1-u/.1)*.35+')';ctx.fillRect(0,0,W,H)}
}

/* ================= S3: the logo assembles ================= */
const ORDER=CELLS.map((c,i)=>({i,k:c.c+c.r*.35+hh(i,4)*.9})).sort((a,b)=>a.k-b.k).map((o,j)=>({...o,j}));
function S3geom(t){const mv=E.inOutExpo(P(t,7.95,8.6));const cell=lerp(56,44,mv),mcx=960,mcy=lerp(520,370,mv);return{mv,cell,mcx,mcy}}
function S3(t){
 if(t<6||t>=10.02)return;
 const {cell,mcx,mcy}=S3geom(t);
 const x0=mcx-4*cell,y0=mcy-2*cell;
 const ex=x0+5.5*cell,ey=y0+1.5*cell;
 const zp=E.inExpo(P(t,9.42,10.0)),Z=1+zp*95;
 // landing times
 const land=ORDER.map(o=>{const t0=6.38+o.j*.034;return{...o,t0,tl:t0+.3}});
 let shake=0;land.forEach(l=>{const d=t-l.tl;if(d>0&&d<.4)shake+=5*Math.exp(-d*18)});
 const sx=(hh(Math.floor(t*60),3)-.5)*shake,sy=(hh(Math.floor(t*60),4)-.5)*shake;
 ctx.save();ctx.translate(ex,ey);ctx.scale(Z,Z);ctx.translate(-ex+sx,-ey+sy);
 // radial light
 const rg=ctx.createRadialGradient(mcx,mcy,0,mcx,mcy,900);rg.addColorStop(0,'rgba(217,119,87,'+.10*P(t,6.6,7.6)+')');rg.addColorStop(1,'rgba(217,119,87,0)');ctx.fillStyle=rg;ctx.fillRect(-W,-H,W*3,H*3);
 // the line
 const lineY=y0+4*cell+.45*cell;
 const g=E.inOutExpo(P(t,6.0,6.42)),c=E.inOutExpo(P(t,7.55,8.0));
 let lw=lerp(lerp(14,W+60,g),8*cell,c),lh=lerp(lerp(14,6,g),.2*cell,c);
 greenLine(mcx,lineY,lw,lh,t,1);
 // pixels
 const allLanded=t>land[land.length-1].t0+.55;
 if(!allLanded){
  land.forEach(l=>{const {r,c}=CELLS[l.i];const p=P(t,l.t0,l.t0+.55);if(p<=0)return;
   const ang=hh(l.i,1)*Math.PI*2,rad=1000+hh(l.i,2)*500;const sxp=mcx+Math.cos(ang)*rad,syp=mcy+Math.sin(ang)*rad;
   const tx=x0+(c+.5)*cell,ty=y0+(r+.5)*cell,e=E.outExpo(p);
   const px=lerp(sxp,tx,e),py=lerp(syp,ty,e),rot=(1-E.outCubic(p))*(hh(l.i,3)-.5)*7,s=cell*lerp(.35,1,spring(p));
   ctx.save();ctx.translate(px,py);ctx.rotate(rot);ctx.fillStyle=C.or;ctx.fillRect(-s/2,-s/2,s,s);ctx.restore()});
 } else mascot(mcx,mcy,cell,{grid:P(t,7.6,8.2),blink:tri(t,9.0,9.22)});
 // landing flashes + debris
 land.forEach(l=>{const d=t-l.tl;if(d<0||d>.5)return;const {r,c}=CELLS[l.i];const cx0=x0+(c+.5)*cell,cy0=y0+(r+.5)*cell;
  if(d<.12){ctx.fillStyle='rgba(255,240,228,'+(1-d/.12)*.8+')';ctx.fillRect(cx0-cell/2,cy0-cell/2,cell,cell)}
  for(let k=0;k<5;k++){const a=hh(l.i,k,8)*Math.PI*2,v=180+hh(l.i,k,9)*260,q=d/.5;const s=7*(1-q);
   ctx.fillStyle=k%2?C.or:C.orL;ctx.fillRect(cx0+Math.cos(a)*v*E.outCubic(q)*.6-s/2,cy0+Math.sin(a)*v*E.outCubic(q)*.6-s/2,s,s)}});
 // impact ring
 const ir=P(t,7.5,8.1);if(ir>0&&ir<1){circ(mcx,mcy,E.outExpo(ir)*900,null,'rgba(243,237,228,'+(1-ir)*.35+')',3)}
 // wordmark + tagline
 chars('Clawdline',W/2,680,t,8.2,{s:156,w:800,ls:-4,al:'center',st:.04});
 words('Every agent Session. One line.',W/2,770,t,8.65,{s:42,w:500,c:C.dim,al:'center',colors:[C.dim,C.dim,C.dim,C.gr,C.gr]});
 ctx.restore();
}

/* ================= S4: sessions ================= */
const SESS=[
 {n:'api-refactor',p:'backend',prov:'Claude Code',st:'waiting'},
 {n:'search-ranking',p:'web',prov:'Codex',st:'working'},
 {n:'release-notes',p:'docs',prov:'Claude Code',st:'done'},
 {n:'push-notifications',p:'mobile',prov:'Codex',st:'working'},
 {n:'flaky-ci',p:'infra',prov:'Claude Code',st:'working'},

function stage(t){

 S1(t);S3(t);S4(t);S5(t);S6(t);S7(t);S8(t);S2(t);
}
const grains=[];for(let g=0;g<6;g++){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');const id=x.createImageData(256,256);
 let s=g*9301+49297;for(let i=0;i<id.data.length;i+=4){s=(s*9301+49297)%233280;const v=s/233280*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255}x.putImageData(id,0,0);grains.push(c)}
function hud(t){
 const a=P(t,6.3,6.8)*(1-P(t,25.6,25.9));if(a<=0)return;

 ctx.fillStyle=C.line;ctx.fillRect(60,H-58,300,2);ctx.fillStyle=C.or;ctx.fillRect(60,H-58,300*t/DUR,2);

}
function render(frame){

}
